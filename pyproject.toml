[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "houdini-research-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "Pillow>=10"]

[project.scripts]
houdini-research = "hlab.server:main"

[tool.setuptools]
packages = ["hlab"]
