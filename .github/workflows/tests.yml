name: Windows unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the MCP and test dependencies
        run: python -m pip install -e . numpy
      - name: Run tests that do not require Houdini
        env:
          HOUDINI_RESEARCH_HOME: ${{ runner.temp }}/houdini-research-unit
        run: python -m unittest discover -s tests -p "test_*.py" -v
